name: Build and Release Extension Charts

on:
  workflow_dispatch:
  release:  
    types: [released]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build-extension-charts:
    uses: rancher/dashboard/.github/workflows/build-extension-charts.yml@master
    # Permissions as in Rancher's publishing guide (extensions.rancher.io, "Publishing an Extension"),
    # plus pull-requests: write, which the reusable workflow's release job asks for; without it
    # the run fails at startup.
    permissions:
      actions: write
      contents: write
      deployments: write
      pages: write
      pull-requests: write
    with:
      target_branch: gh-pages
      tagged_release: ${{ github.ref_name }}
